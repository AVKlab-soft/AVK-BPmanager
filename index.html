<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1320'/%3E%3Cpath d='M9 21l6-10 8 7' stroke='%2331415f' stroke-width='2' fill='none'/%3E%3Ccircle cx='9' cy='21' r='3.4' fill='%2357b6f5'/%3E%3Ccircle cx='15' cy='11' r='3.4' fill='%23f6b83d'/%3E%3Ccircle cx='23' cy='18' r='3.4' fill='%233ed598'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Узел — канвас для сборки промптов из связанных нод: вопрос, контекст, системный промпт и ответы нейросетей." />
    <title>Узел — канвас сборки промптов</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0a0f18;
      }
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #94a2bd;
        font-size: 13px;
      }
      #boot-fallback .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #f6b83d;
        animation: bootpulse 1s ease-in-out infinite;
      }
      @keyframes bootpulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">
        <div class="dot"></div>
        <span>загружаем «Узел»…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
